services:
  gatekeeper:
    build:
      context: ./hee_welcome_builder
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_welcome_builder/.env
    volumes:
      - ./hee_welcome_builder/data:/app/data

  chronicle:
    build:
      context: ./hee_rank
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_rank/.env
    volumes:
      - ./hee_rank/data:/app/data

  sentinel:
    build:
      context: ./hee_mod
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_mod/.env
    volumes:
      - ./hee_mod/logs:/app/logs
      - ./shared_data:/shared_data

  tribunal:
    build:
      context: ./hee_ticket
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_ticket/.env
    volumes:
      - ./hee_ticket:/app
      - ./hee_ticket/data:/app/data
      - ./shared_data:/shared_data:ro
      - ./hee_rank/data:/rank_data:ro

  vault:
    build:
      context: ./hee_economy
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_economy/.env
    volumes:
      - ./hee_economy:/app
      - ./shared_data:/shared_data
      - ./hee_rank/data:/rank_data:ro

  bounty:
    build:
      context: ./hee_giveaway
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_giveaway/.env
    volumes:
      - ./hee_giveaway/data:/app/data
      - ./shared_data:/shared_data
      - ./hee_rank/data:/rank_data:ro

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512M -Duser.language=en -Duser.country=US
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - ./lavalink/plugins:/opt/Lavalink/plugins
    ports:
      - "2333:2333"

  beat:
    build:
      context: ./hee_music
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - lavalink
    env_file:
      - ./hee_music/.env
    volumes:
      - ./hee_music:/app

  arena:
    build:
      context: ./hee_arena
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_arena/.env
    volumes:
      - ./hee_arena:/app
      - ./hee_arena/data:/app/data

  oracle:
    build:
      context: ./hee_oracle
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_oracle/.env
    volumes:
      - ./hee_oracle:/app
      - ./hee_oracle/data:/app/data

