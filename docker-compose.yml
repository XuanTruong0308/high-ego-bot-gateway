services:
  gatekeeper:
    build:
      context: ./hee_welcome_builder
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_welcome_builder/.env
    volumes:
      - ./hee_welcome_builder/data:/app/data

  chronicle:
    build:
      context: ./hee_rank
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_rank/.env
    volumes:
      - ./hee_rank/data:/app/data

  sentinel:
    build:
      context: ./hee_mod
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_mod/.env
    volumes:
      - ./hee_mod/logs:/app/logs
      - ./shared_data:/shared_data

  tribunal:
    build:
      context: ./hee_ticket
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_ticket/.env
    volumes:
      - ./hee_ticket/data:/app/data

  vault:
    build:
      context: ./hee_economy
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_economy/.env
    volumes:
      - ./shared_data:/shared_data
      - ./hee_rank/data:/rank_data:ro

  bounty:
    build:
      context: ./hee_giveaway
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_giveaway/.env
    volumes:
      - ./hee_giveaway/data:/app/data
      - ./shared_data:/shared_data
      - ./hee_rank/data:/rank_data:ro

  beat:
    build:
      context: ./hee_music
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./hee_music/.env
